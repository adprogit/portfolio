# Compile le site et le publie sur GitHub Pages, à chaque push sur `main`.
#
# À activer une fois dans le dépôt : Settings → Pages → Source : « GitHub Actions ».
#
# Le préfixe d'URL vient de `configure-pages` : `/<dépôt>` pour un dépôt de
# projet, vide pour `<utilisateur>.github.io` ou un domaine personnalisé.
# Voir `astro.config.mjs`.
#
# Chaîne d'approvisionnement : uniquement des actions officielles `actions/*`,
# épinglées par empreinte de commit (une étiquette peut être déplacée, une
# empreinte non) ; `npm ci` installe exactement le `package-lock.json`, sans
# scripts d'installation (`.npmrc`).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Installer les dépendances
        run: |
          npm ci
          npm rebuild esbuild

      - name: Vérifier et compiler
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npx astro check
          node tools/shader-parity.mjs
          node tools/pgn-guard.mjs
          npx astro build
          node tools/prune-dist.mjs
          node tools/csp-hashes.mjs
          node tools/check-contrast.mjs
          node tools/audit-dist.mjs

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
